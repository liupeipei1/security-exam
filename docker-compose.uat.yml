version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: exam-mysql-uat
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-exam-db-uat}
      MYSQL_USER: ${DB_USER:-peipei}
      MYSQL_PASSWORD: ${DB_PASSWORD:-298280}
    volumes:
      - exam-mysql-uat-data:/var/lib/mysql
      - ./DML/security_exam_3.sql:/docker-entrypoint-initdb.d/01-security.sql:ro
      - ./DML/exam_config.sql:/docker-entrypoint-initdb.d/02-exam_config.sql:ro
      - ./DML/knowledge_points.sql:/docker-entrypoint-initdb.d/03-knowledge_points.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: exam-redis-uat
    volumes:
      - exam-redis-uat-data:/data

  backend:
    build: ./backend
    container_name: exam-backend-uat
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-uat}
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-exam-db-uat}
      DB_USER: ${DB_USER:-peipei}
      DB_PASSWORD: ${DB_PASSWORD:-298280}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-uat-secret-key-32bytes-minimum!!}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-168}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_APPSECRET: ${WECHAT_APPSECRET:-}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-false}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_API_KEY: ${WECHAT_PAY_API_KEY:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: exam-nginx-uat
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  exam-mysql-uat-data:
  exam-redis-uat-data:
