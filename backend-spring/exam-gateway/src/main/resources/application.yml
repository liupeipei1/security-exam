server:
  port: 8080

exam:
  jwt:
    secret: ${JWT_SECRET:change-me-exam-jwt-secret-key-32bytes-min}
    expiration-hours: ${JWT_EXPIRATION_HOURS:168}

spring:
  application:
    name: exam-gateway
  cloud:
    gateway:
      default-filters:
        - name: JwtAuth
      discovery:
        locator:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        ### user +auth 权限
        - id: account-service
          uri: lb://exam-account-service
          predicates:
            - Path=/api/auth/**
    ##找打用户下的favorite +note
        - id: user-auth-service
          uri: lb://exam-user-center-service
          predicates:
            - Path=/api/favorites/**
            - Path=/api/notes/**
   ### question
        - id: question-service
          uri: lb://exam-question-service
          predicates:
            - Path=/api/banks/**,/api/questions/**,/api/question/**,/api/guide/**,/api/knowledge/**,/api/notes/**,/api/speech/**
  ###考试题目
        - id: exam-service
          uri: lb://exam-exam-service
          predicates:
            - Path=/api/exam/**,/api/exams/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
