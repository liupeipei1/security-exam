server:
  port: 8081

spring:
  application:
    name: exam-auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:exam-db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

exam:
  wechat:
    app-id: ${WECHAT_APPID:}
    app-secret: ${WECHAT_APPSECRET:}
    qr-redirect-uri: ${WECHAT_QR_REDIRECT_URI:http://localhost:8080/api/auth/qrcode/callback}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
