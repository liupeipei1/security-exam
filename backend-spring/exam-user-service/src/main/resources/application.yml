server:
  port: 8082

spring:
  application:
    name: exam-user-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:exam-db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

exam:
  wechat:
    pay:
      enabled: ${WECHAT_PAY_ENABLED:false}
      app-id: ${WECHAT_APPID:}
      mch-id: ${WECHAT_PAY_MCH_ID:}
      api-key: ${WECHAT_PAY_API_KEY:}
      notify-url: ${WECHAT_PAY_NOTIFY_URL:http://localhost:8080/api/user/pay/notify}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
