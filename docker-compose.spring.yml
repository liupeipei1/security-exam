version: '3.8'

# Spring Cloud 版基础设施（MySQL + Redis）
# 微服务请在本地用 Maven 启动，见 backend-spring/README.md

services:
  mysql:
    image: mysql:8.0
    container_name: exam-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: exam-db
    volumes:
      - exam-mysql-data:/var/lib/mysql
      - ./DML/security_exam_3.sql:/docker-entrypoint-initdb.d/01-security.sql:ro
      - ./DML/bank_config.sql:/docker-entrypoint-initdb.d/02-bank_config.sql:ro
      - ./DML/knowledge_points.sql:/docker-entrypoint-initdb.d/03-knowledge_points.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: exam-redis
    ports:
      - "6379:6379"
    volumes:
      - exam-redis-data:/data

volumes:
  exam-mysql-data:
  exam-redis-data:
